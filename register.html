<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Room Cafe - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">Digital Menu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="breakfast.html">Breakfast</a></li>
                    <li class="nav-item"><a class="nav-link" href="lunch.html">Lunch</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="register.html">Register</a></li>
                    <li class="nav-item ms-lg-2">
                        <button id="changeBg" class="btn btn-outline-light btn-sm" type="button">Click to change color</button>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <button id="theme-btn" class="btn btn-outline-light btn-sm" type="button">🌙 Dark Mode</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="fs-1">🌸</span>
                            <h2 class="fw-bold mt-2">Create an Account</h2>
                            <p class="text-muted">Join the Bloom Room Cafe loyalty club</p>
                        </div>

                        <!-- Criterion 5.2: Form Validation with novalidate and no HTML validation attributes -->
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="registerName" class="form-label">Full Name</label>
                                <input type="text" id="registerName" name="fullName" class="form-control" placeholder="e.g. Assem Ozharova">
                                <div id="registerNameError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email Address</label>
                                <input type="text" id="registerEmail" name="email" class="form-control" placeholder="e.g. assem@example.com">
                                <div id="registerEmailError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerPhone" class="form-label">Phone Number</label>
                                <input type="text" id="registerPhone" name="phone" class="form-control" placeholder="e.g. +7 777 123 4567">
                                <div id="registerPhoneError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerUser" class="form-label">Username</label>
                                <input type="text" id="registerUser" name="user" class="form-control" placeholder="Choose a username">
                                <div id="registerUserError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Password</label>
                                <input type="password" id="registerPassword" name="password" class="form-control" placeholder="At least 6 characters with letters & numbers">
                                <div id="registerPasswordError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div class="mb-3">
                                <label for="registerConfirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" id="registerConfirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat your password">
                                <div id="registerConfirmPasswordError" class="form-text text-danger" aria-live="polite"></div>
                            </div>

                            <div id="registerFormStatus" class="mb-3 text-center fw-semibold" role="status" aria-live="polite"></div>

                            <button type="submit" id="registerSubmitBtn" class="btn btn-danger btn-lg w-100">Register</button>

                            <div class="text-center mt-4">
                                <p class="mb-1 text-muted">Already have an account? <a href="login.html" class="fw-bold text-danger text-decoration-none">Log in here</a></p>
                                <p class="mb-0"><a href="home.html" class="text-muted small">Continue as guest to Menu →</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark py-3 text-center text-white mt-auto">
        <div class="container d-flex justify-content-between align-items-center text-body-light">
            <span>This project was made by Merei Sapar and Assem Ozharova.</span>
            <span class="text-muted small">Bloom Room Cafe © 2026</span>
        </div>
    </footer>

    <!-- Shared Toast Notification -->
    <div id="site-notification" class="site-notification" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
